name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # A throwaway PostgreSQL for the integration tests (backend/tests/integration): real constraints, real
    # locks and real concurrency. Each run creates its own random schema there.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: labapp
          POSTGRES_PASSWORD: labapp-ci-only
          POSTGRES_DB: labapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labapp -d labapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests (unit and PostgreSQL integration) with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://labapp:labapp-ci-only@127.0.0.1:5432/labapp_test
        # The coverage floor of pyproject.toml fails the run. The integration tests raise the
        # number above that floor; the report prints it, and only the floor gates the run.
        run: uv run pytest -q -W error --durations=10 --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test id audit
        working-directory: .
        run: |
          node --test tools/audit/testid-audit.test.mjs tools/audit/browser-audit.test.mjs tools/audit/docs-lint.test.mjs tools/smoke/checks.test.mjs
          node tools/audit/testid-audit.mjs

      - name: Documentation lint
        working-directory: .
        run: node tools/audit/docs-lint.mjs

      - name: Tests with coverage (the floor of the coverage configuration must hold)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build the web app (the dev proxy to the API is compiled in)
        working-directory: frontend
        env:
          API_URL: http://127.0.0.1:8000
        run: pnpm build

      - name: Start the API and the web app, then audit the browser states in both themes
        env:
          API_URL: http://127.0.0.1:8000
          SESSION_SECRET: ci-session-secret-not-used-anywhere-else
          # Rate limits off: two audit runs back to back would otherwise share one 120 requests per minute window.
          TEST_MODE: "1"
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          (cd backend && nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &)
          (cd frontend && nohup ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 > ../web.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null && curl -sf http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 1
          done
          status=0
          node tools/audit/browser-audit.mjs --base http://127.0.0.1:3000 --theme light --catalog "$RUNNER_TEMP/testids.md" || status=1
          if [ ! -f "$RUNNER_TEMP/testids.md" ]; then
            echo "::error::The audit did not write the test id catalog because a state did not render; see the failures above"
            status=1
          elif ! diff -u docs/TESTIDS.md "$RUNNER_TEMP/testids.md"; then
            echo "::error::docs/TESTIDS.md is out of date (the diff is above). Apply it, or regenerate the file as tools/audit/README.md describes"
            status=1
          fi
          node tools/audit/browser-audit.mjs --base http://127.0.0.1:3000 --theme dark || status=1
          exit $status

      - name: Show the logs when the audit fails
        if: failure()
        run: |
          echo "--- api.log"; tail -n 50 api.log || true
          echo "--- web.log"; tail -n 50 web.log || true
