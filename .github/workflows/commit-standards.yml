name: commit-standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "range=$PR_BASE..$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "range=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "range=$BEFORE..$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Messages follow Conventional Commits
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          bad=$(git log --no-merges --format='%h %s' "$RANGE" \
            | grep -vE '^[0-9a-f]+ (feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' || true)
          if [ -n "$bad" ]; then
            echo "These commits do not follow Conventional Commits:"
            echo "$bad"
            exit 1
          fi

      - name: No co-author or tool trailers
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          bad=$(git log --format='%h%n%B' "$RANGE" | grep -iE '^co-authored-by:|generated with' || true)
          if [ -n "$bad" ]; then
            echo "Co-author or tool-attribution lines found:"
            echo "$bad"
            exit 1
          fi
