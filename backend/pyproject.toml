[project]
name = "labapp-backend"
version = "0.1.0"
description = "LabApp API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1,<2",
    "argon2-cffi>=25.1.0",
    "fastapi",
    "psycopg[binary]>=3,<4",
    "pydantic-settings",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel.scripts]
# Runs after the dependencies are installed and before the deployment goes live.
build = "python -m app.cli migrate"
