<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The "Libro mayor" site icon: the accent square of the light palette -->
  <!-- carrying the pale double rule of a ledger's struck total (thin,     -->
  <!-- then thick). A filled square, so it reads on a light and a dark tab. -->
